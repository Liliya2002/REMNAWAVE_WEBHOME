user  nginx;
worker_processes  auto;

# warn, а не notice: на notice nginx сыплет сообщениями о каждом срабатывании
# limit_req и о перезагрузках конфига, и настоящие проблемы в этом тонут.
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Логи ──────────────────────────────────────────────────────────────────
  #
  # ГЛАВНОЕ: в лог не должна попадать query-строка. Стандартная переменная
  # $request содержит строку запроса целиком, вместе с параметрами, а через
  # параметры у нас ездят одноразовые токены:
  #   /auth/tg-login?t=…            вход в аккаунт одним запросом
  #   /auth/register/poll?token=…   подтверждение регистрации
  #   /reset-password?token=…       сброс пароля
  # Строка такого лога, отправленная в поддержку или прочитанная по SSH, — это
  # готовый вход в чужой аккаунт, пока токен жив. Поэтому пишем $uri (путь без
  # параметров) и отдельной пометкой отмечаем сам факт их наличия — так же, как
  # это сделано на стороне backend в middleware/requestLog.js.
  #
  # $uri безопасен: он декодирован, но nginx при escape=default (по умолчанию)
  # экранирует управляющие символы, поэтому подсунуть перевод строки и подделать
  # запись в логе не выйдет.

  map $status $log_level {
    default   'запрос  ';
    '~^4'     'ВНИМАНИЕ';
    '~^5'     'ОШИБКА  ';
  }

  # Код ответа словами — чтобы лог читался, а не расшифровывался.
  map $status $status_phrase {
    default   '';
    400       '· запрос не прошёл проверку';
    401       '· не авторизован';
    403       '· доступ запрещён';
    404       '· адрес не найден';
    413       '· тело запроса слишком большое';
    429       '· сработал лимит запросов';
    444       '· соединение закрыто без ответа (сканер)';
    499       '· клиент ушёл, не дождавшись ответа';
    500       '· ошибка на нашей стороне';
    502       '· backend не ответил';
    503       '· сервис временно недоступен';
    504       '· backend не уложился в таймаут';
  }

  map $is_args $args_note {
    default   '';
    '?'       ' (+параметры)';
  }

  # nginx пишет ТОЛЬКО проблемы: ошибки и медленные ответы.
  #
  # Успешные запросы отсюда не пишутся вовсе, и вот почему. Каждый запрос к API
  # уже записывает backend — его строка содержательнее: там номер пользователя
  # и понятное название («оплата», «админка»), которых у nginx нет в принципе.
  # Пока nginx дублировал эти записи, одна загрузка страницы давала под три
  # десятка строк, а полезные тонули среди статики и опросов.
  #
  # Что при этом теряется: успешные загрузки страниц и статики нигде не видны.
  # Это осознанный размен — для счётчиков посещаемости лог контейнера всё равно
  # не годится. Вернуть полную запись на время разбора: заменить `if=$do_log`
  # в access_log ниже на `if=1`.
  map $status $bad_status {
    default   0;
    '~^[45]'  1;
  }
  # $request_time — строка вида «1.305». Считаем медленным от 2 секунд:
  # одна цифра 2-9 перед точкой либо две и больше цифр (10+ секунд).
  map $request_time $slow_request {
    default                    0;
    '~^([2-9]|[1-9][0-9]+)\.'  1;
  }
  map '$bad_status$slow_request' $do_log {
    default  1;
    '00'     0;
  }

  # User-Agent — 120 символов в каждой строке. Он нужен, только когда
  # разбираешься с ошибкой или сканером, поэтому подставляем его при 4xx/5xx.
  # Переменные внутри значения map nginx раскрывает — проверено.
  map $status $ua_note {
    default   '';
    '~^[45]'  ' · $http_user_agent';
  }

  # escape=json, а не умолчание. При escape=default nginx экранирует ВСЕ байты
  # старше 0x7F, и кириллица из map-ов превращается в «Ð·Ð°...» —
  # проверено, лог становится нечитаемым. json экранирует только управляющие
  # символы, кавычку и обратный слэш, а UTF-8 пропускает как есть.
  # Защита при этом сохраняется: путь вида /evil%0A… попадает в лог одной
  # строкой с экранированным переносом — подделать запись в логе нельзя.
  log_format  human  escape=json  '$time_iso8601  $log_level  nginx  $request_method $uri$args_note '
                     '→ $status · $request_time с · $remote_addr $status_phrase$ua_note';

  access_log  /var/log/nginx/access.log  human if=$do_log;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Защита от больших тел (но webhooks могут быть до 100kb)
  client_max_body_size 8m;

  # Gzip
  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_vary on;

  # SSL общие настройки
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # ssl_stapling отключён: с осени 2024 Let's Encrypt не выдаёт OCSP responder URL,
  # nginx генерирует warning при reload. Если вернёшь — раскомментируй обе строки и resolver.
  # ssl_stapling on;
  # ssl_stapling_verify on;
  resolver 1.1.1.1 8.8.8.8 valid=300s;
  resolver_timeout 5s;

  include /etc/nginx/conf.d/*.conf;
}
